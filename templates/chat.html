<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Handover Chat - {{ item.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .chat-box { height: 420px; overflow-y: auto; background: #f8fafc; border-radius: 12px; padding: 16px; }
        .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; font-size: 0.95rem; }
        .msg-me { background: #3b82f6; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .msg-them { background: #e2e8f0; color: #1e293b; margin-right: auto; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 650px;">
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
            <div>
                <h5 class="m-0 fw-bold"><i class="bi bi-chat-quote-fill text-primary me-2"></i>Handover Chat</h5>
                <small class="text-muted">Item: <strong>{{ item.title }}</strong></small>
            </div>
            <a href="/" class="btn btn-outline-secondary btn-sm">Exit Chat</a>
        </div>
        <div class="card-body">
            <div class="chat-box mb-3 d-flex flex-column">
                {% for msg in messages %}
                    <div class="msg-bubble {% if msg.sender_id == current_user.id %}msg-me{% else %}msg-them{% endif %}">
                        {{ msg.content }}
                        <div class="small opacity-75 text-end mt-1" style="font-size: 0.7rem;">
                            {{ msg.created_at.strftime('%H:%M') }}
                        </div>
                    </div>
                {% else %}
                    <div class="text-center text-muted my-auto">
                        <i class="bi bi-shield-lock display-5 d-block mb-2"></i>
                        <p class="m-0 small">No messages yet. Agree on a public campus location (e.g. Student Center, Main Gate) for secure handover.</p>
                    </div>
                {% endfor %}
            </div>
            <form method="POST" class="d-flex gap-2">
                <input type="text" name="content" class="form-control" placeholder="Type a message..." required autocomplete="off">
                <button class="btn btn-primary px-4"><i class="bi bi-send-fill"></i></button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
