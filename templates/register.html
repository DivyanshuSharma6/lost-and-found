<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | MUJ Campus Radar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --muj-orange: #E65100;
            --muj-orange-hover: #D84315;
            --muj-navy: #0D2240;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;

            background:
                linear-gradient(
                    rgba(13, 34, 64, 0.82),
                    rgba(8, 22, 43, 0.92)
                ),
                url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh7qcXDMWLddArhF_2761b0zPcd2jeY3me4WwmY0hrZq9cQA1BH_9doto&s=10");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
        }

        .glass-card {
            width: 100%;
            padding: 38px 32px;
            border-radius: 16px;
            border-top: 5px solid var(--muj-orange);

            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }

        .icon-circle {
            background-color: var(--muj-orange);
            color: #ffffff;
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.25);
        }

        .brand-title {
            color: var(--muj-navy);
            font-size: 25px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: #6c757d;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-label {
            color: var(--muj-navy);
            font-weight: 600;
            font-size: 14px;
        }

        .input-group-text {
            color: var(--muj-orange);
            background: #fff;
            border-right: 0;
        }

        .form-control {
            min-height: 46px;
            border-left: 0;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #ced4da;
            box-shadow: none;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: var(--muj-orange);
        }

        .btn-brand {
            min-height: 46px;
            background-color: var(--muj-orange);
            color: #ffffff;
            border-radius: 8px;
            font-weight: 700;
            border: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-brand:hover {
            background-color: var(--muj-orange-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .login-link {
            color: var(--muj-orange);
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            color: var(--muj-orange-hover);
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #ffd7bd;
        }
    </style>
</head>
<body>

<main class="register-container">
    <section class="glass-card">
        <div class="icon-circle">
            <i class="bi bi-person-plus-fill"></i>
        </div>

        <h1 class="brand-title">Student Registration</h1>
        <p class="brand-subtitle">MUJ Campus Lost &amp; Found Portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 px-3 small rounded-3 mb-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" id="regName" name="name" class="form-control" placeholder="e.g. Aman Sharma" maxlength="100" required autocomplete="name">
                </div>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Campus Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" id="regEmail" name="email" class="form-control" placeholder="name@jaipur.manipal.edu" maxlength="254" required autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label for="regPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" id="regPassword" name="password" class="form-control" placeholder="Min 8 characters" minlength="8" maxlength="128" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 shadow-sm mb-3">
                <i class="bi bi-person-check-fill me-1"></i> Register Account
            </button>
        </form>

        <div class="text-center pt-3 border-top">
            <span class="text-secondary small">Already registered?</span>
            <a href="{{ url_for('login') }}" class="login-link small ms-1">Sign In</a>
        </div>
    </section>

    <div class="text-center">
        <a href="{{ url_for('index') }}" class="back-link">
            <i class="bi bi-arrow-left me-1"></i> Back to Campus Feed
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
