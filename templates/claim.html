<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Item - MUJ Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --muj-orange: #E65100;
            --muj-navy: #0D2240;
            --muj-bg: #F4F6F9;
        }
        body {
            background-color: var(--muj-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 15px;
        }
        .claim-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #E5E7EB;
            border-top: 4px solid var(--muj-navy);
            box-shadow: 0 10px 25px rgba(13, 34, 64, 0.08);
            max-width: 540px;
            margin: 0 auto;
            padding: 35px;
        }
        .btn-brand {
            background-color: var(--muj-orange);
            color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            border: none;
            transition: 0.2s ease;
        }
        .btn-brand:hover {
            background-color: #D84315;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="claim-card">
    <div class="text-center mb-3">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle text-white mb-2" style="background-color: var(--muj-navy);">
            <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h4 class="fw-bold m-0" style="color: var(--muj-navy);">Claim Item Ownership</h4>
        <p class="text-muted small mb-0">Item: <strong>{{ item.title }}</strong></p>
    </div>

    <div class="alert alert-warning small py-2 px-3 mb-3 border-0 rounded-3">
        <i class="bi bi-info-circle-fill me-1"></i> To protect student property, describe details that are <strong>not visible</strong> in public listings (e.g. wallpaper, serial numbers, specific stickers, or internal contents).
    </div>

    <form method="POST">
        <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Proof of Ownership</label>
            <textarea name="proof_description" rows="4" class="form-control" placeholder="Provide confidential proof only the rightful owner would know..." required></textarea>
        </div>

        <button type="submit" class="btn btn-brand w-100 shadow-sm mb-2">
            Submit Ownership Proof
        </button>
        <a href="/" class="btn btn-link w-100 text-center text-secondary text-decoration-none small">Cancel</a>
    </form>
</div>

</body>
</html>
